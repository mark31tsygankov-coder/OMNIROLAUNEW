name: Build launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish OmniroLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Pack ZIP
        shell: pwsh
        run: |
          Copy-Item launcher.config.json out/launcher.config.json -Force
          Compress-Archive -Path out/OmniroLauncher.exe, out/launcher.config.json -DestinationPath OmniroLauncher.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OmniroLauncher-exe
          path: out/OmniroLauncher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OmniroLauncher-zip
          path: OmniroLauncher.zip
